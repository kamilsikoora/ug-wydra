<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Plan kursowania promu</title>

            table, tr, td, th {
                border: 1px solid #ccc;
                border-collapse: collapse;
                padding: 1rem;
            }

    <body>
        <table>
            <thead>

                </tr>

                    <th scope="col">Dni</th>

                    <th scope="row">Sobota:</th>

                    <td>19:00</td>

                <tr>

                </tr>

</html>
