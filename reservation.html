<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Rezerwacje</title>
    </head>

    <body>
        <main>
            <form>
                <div>
                    <label for="group-name">Nazwa grupy*</label>
                    <input type="text" id="group-name" name="groupName" required>
                </div>

                <div>
                    <label for="group-size">Liczba osób:*</label>
                    <input type="number" id="group-size" name="groupSize" min="5" max="48" required>
                </div>

                 <div>
                    <label for="day">Dzien przeprawy:*</label>
                    <input type="date" id="day" name="day" min="2027-05-01" max="2027-09-30" required>
                </div>

                <fieldset>
                    <legend>Brzeg startowy:*</legend>

                    <div>
                        <input type="radio" id="from-first-station" name="from" value="brzeg-gorny" required>
                        <label for="from-first-station">Brzeg Górny</label>
                    </div>

                    <div>
                        <input type="radio" id="from-second-station" name="from" value="kepa-lakowa" required>
                        <label for="from-second-station">Kępa Łąkowa</label>
                    </div>
                </fieldset>

                <div>
                    <label for="cycles">Ilosc rowerow:</label>
                    <input type="number" id="cycles" name="cycles" value="0" max="10">
                </div>

                <div>
                    <label for="email">Email:*</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="pass">Karnet grupowy:</label>
                    <input type="text" id="pass" name="pass" pattern="^WY-[0-9]{4}">
                </div>

                <button>Wyslij</button>
            </form>
        </main>
    </body>
</html>
